aid: amblea
name: Amblea
description: >-
  Amblea is a French mission-driven ("entreprise à mission") healthcare-logistics platform that
  centralizes and optimizes patient (medical / sanitary) transport across the French health system.
  Formed in 2023 from the merger of Ambler (founded 2018) and Sanilea (2013), it operates a
  marketplace connecting healthcare establishments (hospitals, clinics, EHPADs, day-care centers)
  with licensed transport providers (ambulance companies and medical taxi services). The platform
  handles centralized booking and digital prescription management, shared-transport optimization
  (grouping patients per trip), real-time tracking, budget and contract management, and automated
  billing between facilities and transporters. Amblea reports 800+ healthcare establishments,
  6,300 transport partner companies, and roughly 8,000 daily trips, making it one of France's
  largest healthcare-transport coordination platforms. It exposes no public developer API,
  documentation, or SDKs; access is via its web application and direct business arrangements.
